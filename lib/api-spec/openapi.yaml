openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Anonymous quote-request progress
  - name: quotes
    description: Clearly labeled illustrative comparison examples
  - name: admin
    description: Clerk-protected lead operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /leads:
    post:
      operationId: startLead
      tags: [leads]
      summary: Start or resume a quote request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadStartInput"
      responses:
        "201":
          description: Lead started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadSession"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /leads/current:
    get:
      operationId: getCurrentLead
      tags: [leads]
      summary: Retrieve the current saved quote request
      responses:
        "200":
          description: Current lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadSession"
        "404":
          description: No current lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateCurrentLead
      tags: [leads]
      summary: Save quote-request progress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadProgressInput"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadSession"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No current lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteCurrentLead
      tags: [leads]
      summary: Delete the current quote request and its related data
      responses:
        "204":
          description: Lead deleted
        "404":
          description: No current lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /leads/current/quotes:
    post:
      operationId: createIllustrativeQuotes
      tags: [quotes]
      summary: Generate illustrative sample comparison options
      responses:
        "200":
          description: Sample quote options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteCollection"
        "404":
          description: No current lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Lead is incomplete or sample quotes are disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/leads:
    get:
      operationId: listAdminLeads
      tags: [admin]
      summary: Search and filter saved leads
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LeadStatus"
        - name: product
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LeadProduct"
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: campaign
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: purchaseTimeframe
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Matching leads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLeadPage"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/leads/export:
    get:
      operationId: exportAdminLeads
      tags: [admin]
      summary: Export filtered leads as CSV
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LeadStatus"
        - name: product
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LeadProduct"
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: campaign
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: purchaseTimeframe
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
      responses:
        "200":
          description: CSV export
          content:
            text/csv:
              schema:
                type: string
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/leads/{id}:
    get:
      operationId: getAdminLead
      tags: [admin]
      summary: Retrieve lead details, answers, events, and sample results
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lead detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLeadDetail"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteAdminLead
      tags: [admin]
      summary: Permanently delete a lead and related records
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Lead and related records deleted
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateAdminLead
      tags: [admin]
      summary: Update lead status or internal note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLeadUpdateInput"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLead"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/metrics:
    get:
      operationId: getAdminMetrics
      tags: [admin]
      summary: Retrieve lead funnel metrics
      responses:
        "200":
          description: Funnel summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMetrics"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        message:
          type: string
      required: [message]
    LeadProduct:
      type: string
      enum: [auto, home, commercial]
    LeadStatus:
      type: string
      enum: [Started, In Progress, Completed, Contacted, Quoted, Converted, Abandoned]
    LeadAttribution:
      type: object
      additionalProperties:
        type: string
    LeadContact:
      type: object
      properties:
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 32
        contactConsent:
          type: boolean
      required: [firstName, lastName, email, phone, contactConsent]
    LeadStartInput:
      type: object
      properties:
        product:
          $ref: "#/components/schemas/LeadProduct"
        zip:
          type: string
          pattern: "^[0-9]{5}$"
        attribution:
          $ref: "#/components/schemas/LeadAttribution"
      required: [product, zip]
    LeadProgressInput:
      type: object
      properties:
        currentStep:
          type: string
          minLength: 1
          maxLength: 80
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
        answers:
          type: object
          additionalProperties: true
        contact:
          oneOf:
            - $ref: "#/components/schemas/LeadContact"
            - type: "null"
      required: [currentStep, progressPercent, answers]
    LeadSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product:
          $ref: "#/components/schemas/LeadProduct"
        zip:
          type: string
        status:
          $ref: "#/components/schemas/LeadStatus"
        currentStep:
          type: string
        progressPercent:
          type: integer
        answers:
          type: object
          additionalProperties: true
        contact:
          oneOf:
            - $ref: "#/components/schemas/LeadContact"
            - type: "null"
        attribution:
          $ref: "#/components/schemas/LeadAttribution"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, product, zip, status, currentStep, progressPercent, answers, contact, attribution, createdAt, updatedAt]
    QuoteOption:
      type: object
      properties:
        id:
          type: string
        carrierName:
          type: string
        tier:
          type: string
        monthly:
          type: number
        dueToday:
          type: number
        sixMonthTotal:
          type: number
        highlights:
          type: array
          items:
            type: string
        coverage:
          type: object
          additionalProperties:
            type: string
      required: [id, carrierName, tier, monthly, dueToday, sixMonthTotal, highlights, coverage]
    QuoteCollection:
      type: object
      properties:
        illustrative:
          type: boolean
        disclaimer:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/QuoteOption"
      required: [illustrative, disclaimer, options]
    AdminLead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product:
          $ref: "#/components/schemas/LeadProduct"
        zip:
          type: string
        status:
          $ref: "#/components/schemas/LeadStatus"
        currentStep:
          type: string
        progressPercent:
          type: integer
        contact:
          oneOf:
            - $ref: "#/components/schemas/LeadContact"
            - type: "null"
        attribution:
          $ref: "#/components/schemas/LeadAttribution"
        adminNote:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, product, zip, status, currentStep, progressPercent, contact, attribution, adminNote, createdAt, updatedAt]
    AdminLeadPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminLead"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
      required: [items, total, page, pageSize]
    AdminEvent:
      type: object
      properties:
        eventType:
          type: string
        stepKey:
          type: [string, "null"]
        progressPercent:
          type: [integer, "null"]
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
      required: [eventType, stepKey, progressPercent, metadata, createdAt]
    AdminQuoteRecord:
      type: object
      properties:
        provider:
          type: string
        results:
          type: array
          items:
            type: object
            additionalProperties: true
        createdAt:
          type: string
          format: date-time
      required: [provider, results, createdAt]
    AdminRelatedRecord:
      type: object
      properties:
        position:
          type: integer
        details:
          type: object
          additionalProperties: true
      required: [position, details]
    AdminLeadDetail:
      allOf:
        - $ref: "#/components/schemas/AdminLead"
        - type: object
          properties:
            answers:
              type: object
              additionalProperties: true
            events:
              type: array
              items:
                $ref: "#/components/schemas/AdminEvent"
            quotes:
              type: array
              items:
                $ref: "#/components/schemas/AdminQuoteRecord"
            vehicles:
              type: array
              items:
                $ref: "#/components/schemas/AdminRelatedRecord"
            drivers:
              type: array
              items:
                $ref: "#/components/schemas/AdminRelatedRecord"
          required: [answers, events, quotes, vehicles, drivers]
    AdminLeadUpdateInput:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/LeadStatus"
        adminNote:
          type: [string, "null"]
          maxLength: 4000
      minProperties: 1
    AdminMetrics:
      type: object
      properties:
        totalLeads:
          type: integer
        completed:
          type: integer
        inProgress:
          type: integer
        conversionPercent:
          type: number
        byProduct:
          type: object
          additionalProperties:
            type: integer
        byStatus:
          type: object
          additionalProperties:
            type: integer
      required: [totalLeads, completed, inProgress, conversionPercent, byProduct, byStatus]

